services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gongyou
      POSTGRES_USER: gongyou
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - gongyou_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gongyou -d gongyou"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [private]

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://gongyou:${POSTGRES_PASSWORD}@db:5432/gongyou
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
    expose:
      - "3000"
    networks: [private]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-gongyou.wqseric.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - gongyou_caddy_data:/data
      - gongyou_caddy_config:/config
    networks: [private]

volumes:
  gongyou_postgres:
  gongyou_caddy_data:
  gongyou_caddy_config:

networks:
  private:
    internal: false
